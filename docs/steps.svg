<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Путь игрока в Code Climb</title>
  <desc id="desc">Выбери язык и маршрут, прочитай задачу, напиши функцию, проверь код и открой следующий уровень.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a23"/><stop offset="1" stop-color="#0b354b"/></linearGradient>
    <linearGradient id="tile" x2="1" y2="1"><stop stop-color="#164055"/><stop offset="1" stop-color="#0b2533"/></linearGradient>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#e3ec89" stroke-width="2"/></marker>
  </defs>
  <rect width="1200" height="370" rx="24" fill="url(#bg)"/>
  <path d="M0 80H1200M0 290H1200" stroke="#335666"/>
  <text x="40" y="53" font-size="29" font-weight="700" font-family="Arial,sans-serif" fill="#f0f7ef">Твой путь к вершине</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(40 112)"><rect width="198" height="141" rx="13" fill="url(#tile)" stroke="#4d7784"/><text x="20" y="35" fill="#e3ec89" font-size="15" font-weight="700">01 / ВЫБОР</text><text x="20" y="75" fill="#f0f7ef" font-size="22" font-weight="700">Python или C++</text><text x="20" y="108" fill="#b5ced0" font-size="16">Лёгкий → сложный</text></g>
    <g transform="translate(271 112)"><rect width="198" height="141" rx="13" fill="url(#tile)" stroke="#4d7784"/><text x="20" y="35" fill="#e3ec89" font-size="15" font-weight="700">02 / ЗАДАЧА</text><text x="20" y="75" fill="#f0f7ef" font-size="22" font-weight="700">Прочитай цель</text><text x="20" y="108" fill="#b5ced0" font-size="16">Условия и пример</text></g>
    <g transform="translate(502 112)"><rect width="198" height="141" rx="13" fill="url(#tile)" stroke="#4d7784"/><text x="20" y="35" fill="#e3ec89" font-size="15" font-weight="700">03 / РЕШЕНИЕ</text><text x="20" y="75" fill="#f0f7ef" font-size="22" font-weight="700">Напиши функцию</text><text x="20" y="108" fill="#b5ced0" font-size="16">Своим способом</text></g>
    <g transform="translate(733 112)"><rect width="198" height="141" rx="13" fill="url(#tile)" stroke="#4d7784"/><text x="20" y="35" fill="#e3ec89" font-size="15" font-weight="700">04 / ПРОВЕРКА</text><text x="20" y="75" fill="#f0f7ef" font-size="22" font-weight="700">RUN</text><text x="20" y="108" fill="#b5ced0" font-size="16">Проверь примеры</text></g>
    <g transform="translate(964 112)"><rect width="198" height="141" rx="13" fill="#e3ec89"/><text x="20" y="35" fill="#28434a" font-size="15" font-weight="700">05 / ПОДЪЁМ</text><text x="20" y="75" fill="#11242b" font-size="22" font-weight="700">SUBMIT</text><text x="20" y="108" fill="#345158" font-size="16">Открой новый уровень</text></g>
  </g>
  <g fill="none" stroke="#e3ec89" stroke-width="3" marker-end="url(#tip)"><path d="M243 182H264"/><path d="M474 182H495"/><path d="M705 182H726"/><path d="M936 182H957"/></g>
  <text x="40" y="334" fill="#b5ced0" font-family="Arial,sans-serif" font-size="18">Проверяется ответ функции, поэтому правильную задачу можно решить разными способами.</text>
</svg>
