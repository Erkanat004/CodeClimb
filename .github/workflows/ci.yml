name: Проверка Code Climb

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:accounts
      - run: npm run test:python
      - run: npm run test:cpp
      - run: npm run build:network
